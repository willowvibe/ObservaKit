name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: landing-page/package-lock.json
      - name: Install dependencies
        working-directory: ./landing-page
        run: npm ci
      - name: Build project
        working-directory: ./landing-page
        run: npm run build
      - name: Fetch demo video for inline playback
        run: |
          curl -fsSL --retry 3 \
            -o landing-page/dist/observakit-demo.mp4 \
            https://github.com/willowvibe/ObservaKit/releases/download/v1.0.0/observakit-demo-v2.mp4
          test -s landing-page/dist/observakit-demo.mp4
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './landing-page/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
